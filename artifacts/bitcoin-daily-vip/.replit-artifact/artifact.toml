kind = "web"
previewPath = "/"
title = "Bitcoin Daily VIP"
version = "1.0.0"
id = "artifacts/bitcoin-daily-vip"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8082

[services.development]
run = "pnpm --filter @workspace/bitcoin-daily-vip run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bitcoin-daily-vip", "run", "build" ]
publicDir = "artifacts/bitcoin-daily-vip/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8082"
BASE_PATH = "/"
