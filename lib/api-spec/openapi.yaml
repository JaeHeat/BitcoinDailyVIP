  /admin/coupons:
    get:
      operationId: listCoupons
      tags: [admin]
      summary: List all Stripe coupons
      responses:
        "200":
          description: Coupon list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
