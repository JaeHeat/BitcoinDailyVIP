        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/members/{id}/reset-trial:
    post:
      operationId: resetMemberTrial
      tags: [admin]
      summary: Cancel subscription and clear trial history so the member can start a fresh trial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionActionResult"
        "400":
          description: Bad request
          content:
            application/json:
