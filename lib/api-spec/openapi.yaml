              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /discord/sync-logs:
    get:
      operationId: getDiscordSyncLogs
      tags: [discord]
      summary: List recent Discord sync log entries (admin)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: failuresOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Discord sync log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordSyncLogsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CheckoutSession:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    SubscriptionStatus:
      type: object
      properties:
        subscriptionId:
          type: ["string", "null"]
        status:
          type: string
        planTier:
          type: ["string", "null"]
        currentPeriodEnd:
          type: ["string", "null"]
        resumeDate:
          type: ["string", "null"]
        cancelAtPeriodEnd:
          type: boolean
        paused:
          type: boolean
      required:
        - status
        - cancelAtPeriodEnd
        - paused

    CancellationSurveyInput:
      type: object
      properties:
        reason:
          type: string
        offerAccepted:
          type: boolean
      required:
        - reason
        - offerAccepted

    OAuthUrl:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    DiscordSyncLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        discordUserId:
          type: ["string", "null"]
        action:
          type: string
        stripeEvent:
          type: ["string", "null"]
        success:
          type: boolean
        errorMessage:
          type: ["string", "null"]
        attempts:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - action
        - success
        - attempts
        - createdAt

    DiscordSyncLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/DiscordSyncLog"
        failureCount:
          type: integer
        totalCount:
          type: integer
      required:
        - logs
        - failureCount
        - totalCount

    DiscordStatus:
      type: object
      properties:
        connected:
          type: boolean
        discordUserId:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
      required:
        - connected

    CronResult:
      type: object
      properties:
        processed:
          type: integer
        failed:
          type: integer
      required:
        - processed
        - failed

    WinbackStats:
      type: object
      properties:
        total:
          type: integer
        sent:
          type: integer
        opened:
          type: integer
        clicked:
          type: integer
        rejoined:
          type: integer
        cancelled:
          type: integer
        byType:
          type: array
          items:
            $ref: "#/components/schemas/WinbackStatsByType"
      required:
        - total
        - sent
        - opened
        - clicked
        - rejoined
        - cancelled
        - byType

    WinbackStatsByType:
      type: object
      properties:
        jobType:
          type: string
        total:
          type: integer
        sent:
          type: integer
        opened:
          type: integer
        clicked:
          type: integer
      required:
        - jobType
        - total
        - sent
        - opened
        - clicked

    AdminStats:
      type: object
      properties:
        mrr:
          type: integer
        grossVolume:
          type: integer
        netVolume:
          type: integer
        activeSubscribers:
          type: integer
        pausedSubscribers:
          type: integer
        newUsersThisMonth:
          type: integer
        newSubscribersThisMonth:
          type: integer
        newTrialsThisMonth:
          type: integer
        trialConversionRate:
          type: integer
        churnedThisMonth:
          type: integer
        churnRate:
          type: number
        discordSyncFailures:
          type: integer
        totalSubscribers:
          type: integer
      required:
        - mrr
        - grossVolume
        - netVolume
        - activeSubscribers
        - pausedSubscribers
        - newUsersThisMonth
        - newSubscribersThisMonth
        - newTrialsThisMonth
        - trialConversionRate
        - churnedThisMonth
        - churnRate
        - discordSyncFailures
        - totalSubscribers

    AdminSubscriber:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        subscriptionStatus:
          type: string
        planTier:
          type: ["string", "null"]
        discordConnected:
          type: boolean
        discordUsername:
          type: ["string", "null"]
        joinedAt:
          type: string
      required:
        - id
        - email
        - subscriptionStatus
        - discordConnected
        - joinedAt

    AdminSubscribersResponse:
      type: object
      properties:
        subscribers:
          type: array
          items:
            $ref: "#/components/schemas/AdminSubscriber"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - subscribers
        - total
        - page
        - limit

    ChurnChartPoint:
      type: object
      properties:
        date:
          type: string
        newSubscribers:
          type: integer
        churned:
          type: integer
      required:
        - date
        - newSubscribers
        - churned

    ChurnChartResponse:
      type: object
      properties:
        days:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChurnChartPoint"
      required:
        - days
        - data

    SurveyReason:
      type: object
      properties:
        reason:
          type: string
        count:
          type: integer
        percentage:
          type: integer
      required:
        - reason
        - count
        - percentage

    SurveyResultsResponse:
      type: object
      properties:
        total:
          type: integer
        offerAcceptedCount:
          type: integer
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/SurveyReason"
      required:
        - total
        - offerAcceptedCount
        - reasons

    CheckoutSessionRequest:
      type: object
      properties:
        priceType:
          type: string
          enum: [monthly, yearly, premium, premium-yearly]
        couponCode:
          type: string
      required:
        - priceType

    ChangePlanRequest:
      type: object
      properties:
        priceType:
          type: string
          enum: [monthly, yearly, premium, premium-yearly]
      required:
        - priceType

    AddDaysRequest:
      type: object
      properties:
        days:
          type: integer
      required:
        - days

    RefundRequest:
      type: object
      properties:
        chargeId:
          type: string
        amount:
          type: integer
          description: Amount in cents (omit for full refund)
      required:
        - chargeId

    RefundResult:
      type: object
      properties:
        success:
          type: boolean
        refundId:
          type: string
        amount:
          type: integer
        message:
          type: string
      required:
        - success
        - refundId
        - amount
        - message

    StripeCharge:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
        created:
          type: string
        refunded:
          type: boolean
        amountRefunded:
          type: integer
        receiptUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
      required:
        - id
        - amount
        - currency
        - status
        - created
        - refunded
        - amountRefunded

    MemberProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        subscriptionStatus:
          type: ["string", "null"]
        planTier:
          type: ["string", "null"]
        discordConnected:
          type: boolean
        discordUsername:
          type: ["string", "null"]
        joinedAt:
          type: string
        manualTrialEndsAt:
          type: ["string", "null"]
        stripeCustomerId:
          type: ["string", "null"]
        subscriptionId:
          type: ["string", "null"]
        charges:
          type: array
          items:
            $ref: "#/components/schemas/StripeCharge"
        liveSubscription:
          oneOf:
            - $ref: "#/components/schemas/LiveSubscriptionDetail"
            - type: "null"
      required:
        - id
        - email
        - discordConnected
        - joinedAt
        - charges

    CouponCreateRequest:
      type: object
      properties:
        name:
          type: string
        percentOff:
          type: number
        amountOff:
          type: integer
          description: Amount off in cents (use instead of percentOff)
        currency:
          type: string
          description: Required when amountOff is set
        duration:
          type: string
          enum: [once, repeating, forever]
        durationInMonths:
          type: integer
          description: Required when duration is repeating
        maxRedemptions:
          type: integer
        code:
          type: string
          description: Promo code string (creates a promotion code for this coupon)
      required:
        - name
        - duration

    CouponResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: ["string", "null"]
        percentOff:
          type: ["number", "null"]
        amountOff:
          type: ["integer", "null"]
        currency:
          type: ["string", "null"]
        duration:
          type: string
        durationInMonths:
          type: ["integer", "null"]
        valid:
          type: boolean
        timesRedeemed:
          type: integer
        maxRedemptions:
          type: ["integer", "null"]
        promoCode:
          type: ["string", "null"]
          description: Promotion code string if one was created
      required:
        - id
        - duration
        - valid
        - timesRedeemed

    CouponListResponse:
      type: object
      properties:
        coupons:
          type: array
          items:
            $ref: "#/components/schemas/CouponResult"
      required:
        - coupons

    GrantTrialRequest:
      type: object
      properties:
        email:
          type: string
        days:
          type: integer
      required:
        - email
        - days

    GrantTrialResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        trialEndsAt:
          type: string
      required:
        - success
        - message
        - trialEndsAt

    LiveSubscriptionDetail:
      type: object
      properties:
        trialEnd:
          type: ["string", "null"]
        currentPeriodEnd:
          type: ["string", "null"]
        cancelAtPeriodEnd:
          type: boolean
        cancelAt:
          type: ["string", "null"]
        paused:
          type: boolean
        discountId:
          type: ["string", "null"]
        discountName:
          type: ["string", "null"]
        discountPercentOff:
          type: ["number", "null"]
        discountAmountOff:
          type: ["integer", "null"]
        currentPriceId:
          type: ["string", "null"]
        currentPriceAmount:
          type: ["integer", "null"]
        currentPriceCurrency:
          type: ["string", "null"]
        currentPriceInterval:
          type: ["string", "null"]
      required:
        - cancelAtPeriodEnd
        - paused

    SubscriptionActionResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    CancelSubscriptionRequest:
      type: object
      properties:
        immediately:
          type: boolean
      required:
        - immediately

    ApplyCouponRequest:
      type: object
      properties:
        couponId:
          type: string
      required:
        - couponId

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
