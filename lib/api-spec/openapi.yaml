      summary: Remove the active discount from a member's subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionActionResult"
        "400":
          description: Bad request
          content:
            application/json:
