      operationId: applyMemberCoupon
      tags: [admin]
      summary: Apply a coupon discount to a member's subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCouponRequest"
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionActionResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
