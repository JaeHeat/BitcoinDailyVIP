          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/members/{id}/change-plan:
    post:
      operationId: changeMemberPlan
      tags: [admin]
      summary: Change a member's subscription plan immediately with prorations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePlanRequest"
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionActionResult"
        "400":
